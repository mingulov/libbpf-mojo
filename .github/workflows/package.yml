# SPDX-License-Identifier: GPL-3.0-or-later
# Tier 2: docker clean-room package proof. Unprivileged from
# the runner's view (plain docker build/run on a hosted
# runner); the privilege stays inside the disposable
# compiler-free container that replays the exact tarball.
# Safe for pull requests. Must pass; a skip means docker is
# missing and fails the run instead of passing silently.
#
# Same provisioning as Tier 1: the locked ubuntu-26.04
# toolchain generations, apt system tools, and tools/build
# verification. The lane rebuilds the tarball with
# tools/package, checks the manifest hashes, and runs the
# packaged example plus missing/incompatible-library
# negatives in a fresh container with neither compiler nor
# Pixi. The proven tarball is kept as a run artifact for
# inspection; it is not a release.
name: package

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          # The image preinstalls a newer cmake; the locked
          # toolchain needs exactly the archive version.
          sudo apt-get install -y --no-install-recommends \
            --allow-downgrades \
            clang bpftool cmake=4.2.3-2ubuntu2 ninja-build \
            make pkg-config libelf-dev zlib1g-dev
          # The image also ships a Kitware cmake in /usr/local
          # that shadows the archive binary; remove it so the
          # locked cmake resolves (verified by tools/build).
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/ctest \
            /usr/local/bin/cpack /usr/local/bin/ccmake
      - name: Build
        run: ./tools/build
      - name: Clean-room package lane
        run: ./tools/test package || exit 1
      - name: Keep proven tarball
        uses: actions/upload-artifact@v4
        with:
          name: libbpf-mojo-tarball
          path: dist/*.tar.gz
          if-no-files-found: error
