# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Tier 2: docker clean-room package proof. Unprivileged from
# the runner's view (plain docker build/run on a hosted
# runner); the privilege stays inside the disposable
# compiler-free container that replays the exact tarball.
# Safe for pull requests. Must pass; a skip means docker is
# missing and fails the run instead of passing silently.
#
# Same provisioning as Tier 1: the locked ubuntu-26.04
# toolchain generations, apt system tools, and tools/build
# verification. The lane rebuilds the tarball with
# tools/package, checks the manifest hashes, and runs the
# packaged example plus missing/incompatible-library
# negatives in a fresh container with neither compiler nor
# Pixi. The proven tarball is kept as a run artifact for
# inspection; it is not a release.
name: package

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install pixi
        run: |
          python3 tools/install-pixi --prefix "$HOME/.pixi"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build make pkg-config \
            libelf-dev zlib1g-dev
      - name: Build
        run: ./tools/build
      - name: Clean-room package lane
        run: ./tools/test package || exit 1
      - name: Keep proven tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: libbpf-mojo-tarball
          path: dist/*.tar.gz
          if-no-files-found: error
