# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Tags do not build or publish; hosted builds always create new candidates.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted build creates a new candidate; promotion only copies stored bytes
        type: choice
        options: [build-candidate, dry-run, promote]
        required: true
      arm:
        description: Enter ARM-BUILD-CANDIDATE, ARM-DRY-RUN, or ARM-PROMOTE
        type: string
        required: true
      request:
        description: Promotion JSON with repository, source_commit, run_id, artifact_id, artifact_sha256 and tag
        type: string
        default: '{}'

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    if: inputs.mode == 'build-candidate' && inputs.arm == 'ARM-BUILD-CANDIDATE'
    environment: release-custody
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install pixi
        run: |
          python3 tools/install-pixi --prefix "$HOME/.pixi"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build make pkg-config patchelf \
            libelf-dev zlib1g-dev python3-pytest
      - name: Build
        run: ./tools/build
      - name: Gate suites
        run: |
          ./tools/test native --host-only || exit 1
          ./tools/test mojo --host-only || exit 1
          for suite in runner selftest provenance release-custody \
              package-consumer package source-export; do
            ./tools/test "$suite" || exit 1
          done
      - name: Build tarball
        run: ./tools/package
      - name: Verify the exact retained archive without rebuilding
        run: |
          python3 - <<'PYTEST'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests/package')
          import test_package as package
          import test_consumer_lane as consumer
          version = package.package_version()
          archive = str(Path('dist') / ('libbpf-mojo-' + version + '.tar.gz'))
          package.verify_manifest(archive, version)
          package.clean_room(archive, version)
          consumer.object_consumer_check(archive, version)
          PYTEST
      - name: Retain corresponding source and seal hosted identity
        run: |
          git archive --format=tar.gz --prefix=libbpf-mojo-source/ --output=dist/source.tar.gz HEAD
          ./tools/release-custody seal --directory dist
      - name: Attest actual hosted build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: dist/*
      - name: Retain immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: candidate-${{ github.sha }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error
          overwrite: false
  promote:
    if: inputs.mode != 'build-candidate'
    runs-on: ubuntu-26.04
    environment: release-custody
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stored bytes and promote only when explicitly armed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ inputs.request }}
          RELEASE_ARM: ${{ inputs.arm }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: ./tools/release-custody "$RELEASE_MODE" --directory release-stored
