# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Release: tag-triggered tarball build and GitHub Release
# publication. A tag `vX.Y.Z` (or a manual dispatch dry run)
# provisions the locked toolchain exactly like the tier
# workflows, runs the offline gate suites plus the
# clean-room package lane, builds
# dist/libbpf-mojo-<version>.tar.gz from the clean tag
# tree, and uploads the tarball plus a sha256 file to the
# tag's GitHub Release. Dispatch runs build everything but
# publish nothing. MemVeil consumes releases by exact
# version plus tarball hash in its toolchain lock, so a
# libbpf-mojo release never changes MemVeil until MemVeil's
# pin is deliberately updated. Rollback is a new tag.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install pixi
        run: |
          python3 tools/install-pixi --prefix "$HOME/.pixi"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build make pkg-config \
            libelf-dev zlib1g-dev
      - name: Build
        run: ./tools/build
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pixi.toml','rb'))['workspace']['version'])")"
          if [ "$TAG" != "v$VER" ]; then
            echo "tag $TAG does not match pixi.toml $VER" >&2
            exit 1
          fi
      - name: Gate suites
        run: |
          ./tools/test native --host-only || exit 1
          ./tools/test mojo --host-only || exit 1
          for suite in runner selftest provenance \
              package-consumer package source-export; do
            ./tools/test "$suite" || exit 1
          done
      - name: Build tarball
        run: ./tools/package
      - name: Checksums
        run: |
          cd dist
          sha256sum libbpf-mojo-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            dist/libbpf-mojo-*.tar.gz dist/SHA256SUMS.txt
