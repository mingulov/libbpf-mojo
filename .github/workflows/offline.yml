# SPDX-License-Identifier: GPL-3.0-or-later
# Tier 1: unprivileged suites. Safe for pull requests from any
# source: no privileges, no docker, no secrets. Every lane must
# pass; a skip here means broken provisioning and fails the run.
#
# The lanes need the locked toolchain (toolchain.lock.json):
# ubuntu-26.04 ships its generations, apt provisions the system
# tools (including libelf/zlib headers for the libbpf source
# build), and tools/build verifies every exact version before
# compiling. The sanitizer job rebuilds into build-san/ with
# gcc ASan/UBSan and runs the same native suites there; those
# binaries are test-only and never packaged.
name: offline

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          # The image preinstalls a newer cmake; the locked
          # toolchain needs exactly the archive version.
          sudo apt-get install -y --no-install-recommends \
            --allow-downgrades \
            clang bpftool cmake=4.2.3-2ubuntu2 ninja-build \
            make pkg-config libelf-dev zlib1g-dev
          # The image also ships a Kitware cmake in /usr/local
          # that shadows the archive binary; remove it so the
          # locked cmake resolves (verified by tools/build).
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/ctest \
            /usr/local/bin/cpack /usr/local/bin/ccmake
      - name: Build
        run: ./tools/build
      - name: Offline suites
        run: |
          for suite in native mojo runner selftest provenance \
              package-consumer; do
            ./tools/test "$suite" || exit 1
          done

  sanitize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          # The image preinstalls a newer cmake; the locked
          # toolchain needs exactly the archive version.
          sudo apt-get install -y --no-install-recommends \
            --allow-downgrades \
            clang bpftool cmake=4.2.3-2ubuntu2 ninja-build \
            make pkg-config libelf-dev zlib1g-dev
          # The image also ships a Kitware cmake in /usr/local
          # that shadows the archive binary; remove it so the
          # locked cmake resolves (verified by tools/build).
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/ctest \
            /usr/local/bin/cpack /usr/local/bin/ccmake
      - name: Sanitizer build
        run: ./tools/build --sanitize
      - name: Sanitizer native suites
        run: LMB_BUILD_DIR=build-san ./tools/test native
