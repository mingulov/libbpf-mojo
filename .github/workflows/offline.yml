# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Tier 1: unprivileged host-only suites. Safe for pull requests
# from any source: no privileges, no docker, no secrets. The
# native and Mojo lanes run with explicit --host-only: live
# kernel cases are declared NOT_RUN omissions published by the
# runners, never implied support. Every selected test must pass;
# a skip inside the selection means broken provisioning and
# fails the run. Live success is earned separately on the
# privileged lanes.
#
# The lanes need the locked toolchain (toolchain.lock.json):
# ubuntu-26.04 ships its generations, apt provisions the system
# tools (including libelf/zlib headers for the libbpf source
# build), and tools/build verifies the locked versions before
# compiling. The sanitizer job rebuilds into build-san/ with
# gcc ASan/UBSan and runs the same native host-only scope there;
# those binaries are test-only and never packaged.
name: offline

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build make pkg-config \
            libelf-dev zlib1g-dev
      - name: Build
        run: ./tools/build
      - name: Offline suites
        run: |
          ./tools/test native --host-only || exit 1
          ./tools/test mojo --host-only || exit 1
          for suite in runner selftest provenance \
              package-consumer; do
            ./tools/test "$suite" || exit 1
          done

  sanitize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build make pkg-config \
            libelf-dev zlib1g-dev
      - name: Sanitizer build
        run: ./tools/build --sanitize
      - name: Sanitizer native suites
        run: LMB_BUILD_DIR=build-san ./tools/test native --host-only
