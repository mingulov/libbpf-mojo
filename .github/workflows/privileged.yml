# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Tier 3: privileged live-kernel suites (real tracepoint load,
# attach, event flow, and fault cleanup). Push to main and
# manual dispatch only: BPF collection privilege must never
# run untrusted pull-request code.
#
# Exit 77 from a suite means the runner kernel lacks BPF
# support; it is recorded as a visible SKIP in the step
# summary, never as qualification success. Every required lane must pass; a skip
# blocks this qualification job. Raw native logs stay local, and uploaded
# status receipts retain native exits and raw-log hashes.
name: privileged

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privileged:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install pixi
        run: |
          python3 tools/install-pixi --prefix "$HOME/.pixi"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build make pkg-config \
            libelf-dev zlib1g-dev
      - name: Build
        run: ./tools/build
      - name: Required live-suite results
        run: sudo -n python3 ./tools/qualification-results evidence live-tracepoint cleanup
      - name: Upload allowlisted native status receipts on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: privileged-status
          path: |
            evidence/results.json
            evidence/*.log
          if-no-files-found: warn
